name: iOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build BlocsWavePro (iOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project BlocsWavePro/BlocsWavePro.xcodeproj \
            -scheme BlocsWavePro \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iOS Device archive & IPA
        run: |
          xcodebuild \
            -project BlocsWavePro/BlocsWavePro.xcodeproj \
            -scheme BlocsWavePro \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/BlocsWavePro.app build/Payload/
          cd build && zip -r BlocsWavePro-unsigned.ipa Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlocsWavePro-unsigned-ipa
          path: build/BlocsWavePro-unsigned.ipa
          retention-days: 14
